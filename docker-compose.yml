name: agent-knowledge-hub

services:
  neo4j:
    image: neo4j:5.26.30-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Reuse NEO4J_AUTH instead of declaring another NEO4J_* variable: Neo4j
      # rejects unknown variables as configuration. A real query also avoids
      # marking the service ready while Bolt is listening but still starting.
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  chroma:
    image: ghcr.io/chroma-core/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma/
    healthcheck:
      # Official Chroma images do not include curl or Python. Bash's /dev/tcp
      # is sufficient here: a listening HTTP port means the server is ready.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000; exec 3>&-; exec 3<&-'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./python
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY before running Docker Compose}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      VECTOR_STORE_TYPE: chroma
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      UPLOAD_DIR: ./uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      MAX_BATCH_UPLOAD_FILES: ${MAX_BATCH_UPLOAD_FILES:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    volumes:
      - app_uploads:/app/uploads
      - app_table_data:/app/table_data
    depends_on:
      neo4j:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  chroma_data:
  app_uploads:
  app_table_data:
